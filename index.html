<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Devly</title>
  </head>
  <body>
    <header id="header">
      <div class="soon">
        <span></span>
        <h2>Devly</h2>
      </div>

      <div class="switch-container">
        <p>Mode escuro</p>

        <button
          class="switch"
          type="button"
          aria-label="Alternar tema"
          aria-pressed="true"
        >
          <span class="switch-sun" aria-hidden="true"></span>
          <span class="switch-moon" aria-hidden="true"></span>
          <span class="switch-thumb" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main>
      <div class="profile">
        <img src="./assets/profile.png" alt="Foto de perfil" />
        <p class="profile-presentation">OLÁ, EU SOU</p>
        <h1 class="profile-name">Mary Brito</h1>
        <p class="profile-username">@maykbrito</p>
        <p class="profile-bio">
          Que bom ter você aqui.<br />
          Escolha um link e vamos nos conectar.
        </p>
      </div>
    </main>
  </body>
</html>
